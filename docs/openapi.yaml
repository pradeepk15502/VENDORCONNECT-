openapi: 3.0.3
info:
  title: VendorConnect API
  version: 1.0.0
  description: 'Local product discovery: find what you need at nearby shops.'
paths:
  /api/v1/addresses:
    get:
      operationId: addresses_list
      description: |-
        A customer's saved delivery addresses — a small, personal, unpaginated list (same shape as
        vendor quick replies: bounded, always fetched in full).
      tags:
      - addresses
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Address'
          description: ''
    post:
      operationId: addresses_create
      description: |-
        A customer's saved delivery addresses — a small, personal, unpaginated list (same shape as
        vendor quick replies: bounded, always fetched in full).
      tags:
      - addresses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AddressWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AddressWriteRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
          description: ''
  /api/v1/addresses/{address_id}:
    get:
      operationId: addresses_retrieve
      parameters:
      - in: path
        name: address_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - addresses
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
          description: ''
    patch:
      operationId: addresses_partial_update
      parameters:
      - in: path
        name: address_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - addresses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAddressWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAddressWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAddressWriteRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
          description: ''
    delete:
      operationId: addresses_destroy
      parameters:
      - in: path
        name: address_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - addresses
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/admin/ai/detections:
    get:
      operationId: admin_ai_detections_list
      description: |-
        GET /admin/ai/detections — minimal operational visibility (master prompt §25): detection
        volume, failures, which provider/model produced them. Deliberately not a second admin CRUD
        panel — read-only, same `IsStaffRole` bar as the Phase 9 report queue.
      parameters:
      - in: query
        name: status
        schema:
          type: string
        description: pending | done | failed | confirmed | discarded
      - in: query
        name: vendor
        schema:
          type: string
        description: Vendor handle
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AIDetectionListItem'
          description: ''
  /api/v1/admin/audit-logs:
    get:
      operationId: admin_audit_logs_list
      parameters:
      - in: query
        name: action
        schema:
          type: string
        description: Exact action code, e.g. vendor.verified
      - in: query
        name: actor
        schema:
          type: string
        description: Actor's phone (exact) or user id
      - in: query
        name: date_from
        schema:
          type: string
        description: ISO 8601 datetime, inclusive
      - in: query
        name: date_to
        schema:
          type: string
        description: ISO 8601 datetime, inclusive
      - in: query
        name: page
        schema:
          type: integer
      - in: query
        name: page_size
        schema:
          type: integer
      - in: query
        name: target_id
        schema:
          type: string
      - in: query
        name: target_type
        schema:
          type: string
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditLog'
          description: ''
  /api/v1/admin/categories:
    get:
      operationId: admin_categories_list
      description: |-
        GET /admin/categories — unlike the public `/categories`, includes inactive ones and real
        usage counts, so admin staff can spot an unused or duplicated taxonomy entry (master prompt
        §10). Read-only: category CRUD (merge/rename) is deferred — see docs/ARCHITECTURE.md D32.
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminCategory'
          description: ''
  /api/v1/admin/dashboard:
    get:
      operationId: admin_dashboard_retrieve
      description: |-
        GET /admin/dashboard — real, freshly-computed platform metrics (Phase 11 §4/§5). Every count
        is a live DB aggregate for the requested period; nothing here is cached, estimated or seeded —
        an empty platform genuinely shows zeroes, not placeholder numbers.
      parameters:
      - in: query
        name: date_from
        schema:
          type: string
        description: Required when range=custom.
      - in: query
        name: date_to
        schema:
          type: string
        description: Required when range=custom.
      - in: query
        name: range
        schema:
          type: string
          enum:
          - 30d
          - 7d
          - custom
          - today
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDashboard'
          description: ''
  /api/v1/admin/orders:
    get:
      operationId: admin_orders_list
      description: |-
        GET /admin/orders — read-only cross-vendor/cross-customer visibility (master prompt §23).
        No refund/payment action lives here; `_settle_payment` (checkout/transition) is unchanged.
      parameters:
      - in: query
        name: fulfilment
        schema:
          type: string
        description: pickup | delivery
      - in: query
        name: page
        schema:
          type: integer
      - in: query
        name: page_size
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
        description: Search by order number, customer name or vendor handle.
      - in: query
        name: status
        schema:
          type: string
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminOrderList'
          description: ''
  /api/v1/admin/orders/{order_id}:
    get:
      operationId: admin_orders_retrieve
      description: |-
        Reuses the same `OrderSerializer` both customer and vendor sides already see — deliberately
        (master prompt §24: "minimize exposed personal information"); it already omits the customer's
        phone number (see `_OrderCustomerRefSerializer`), which an admin support view doesn't need
        either to answer "what happened to this order".
      parameters:
      - in: path
        name: order_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
  /api/v1/admin/products:
    get:
      operationId: admin_products_list
      description: |-
        GET /admin/products — every vendor's listing, across the whole platform (master prompt §10).
        Read-only: admin staff identify duplicate/suspicious/inactive listings themselves by browsing
        and filtering; nothing here writes to a vendor's own price/stock (see `AdminListingSerializer`).
      parameters:
      - in: query
        name: availability
        schema:
          type: string
        description: in_stock | low_stock | out_of_stock.
      - in: query
        name: category
        schema:
          type: string
        description: Category slug filter.
      - in: query
        name: page
        schema:
          type: integer
      - in: query
        name: page_size
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
        description: Search by listing name.
      - in: query
        name: status
        schema:
          type: string
        description: active | paused | deleted.
      - in: query
        name: vendor
        schema:
          type: string
        description: Vendor handle filter.
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminListing'
          description: ''
  /api/v1/admin/users:
    get:
      operationId: admin_users_list
      description: |-
        GET /admin/users — any staff role may view (master prompt §6); suspend/restore are gated
        separately below by the specific `accounts.manage_users` permission, matching the coarse-list /
        fine-action split every other admin surface in this codebase already uses (moderation, AI).
      parameters:
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: page
        schema:
          type: integer
      - in: query
        name: page_size
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
        description: Search by name or phone (partial match).
      - in: query
        name: role
        schema:
          type: string
        description: customer | vendor | admin | moderator | support
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminUserList'
          description: ''
  /api/v1/admin/users/{user_id}:
    get:
      operationId: admin_users_retrieve
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserDetail'
          description: ''
  /api/v1/admin/users/{user_id}/restore:
    post:
      operationId: admin_users_restore_create
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserDetail'
          description: ''
  /api/v1/admin/users/{user_id}/suspend:
    post:
      operationId: admin_users_suspend_create
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserSuspendRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminUserSuspendRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminUserSuspendRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserDetail'
          description: ''
  /api/v1/admin/vendors:
    get:
      operationId: admin_vendors_list
      description: |-
        GET /admin/vendors — any staff role may browse/search every vendor regardless of status
        (unlike the public `/vendors` list, which only ever shows `STATUS_ACTIVE` ones).
      parameters:
      - in: query
        name: category
        schema:
          type: string
        description: Category slug.
      - in: query
        name: page
        schema:
          type: integer
      - in: query
        name: page_size
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
        description: Search by shop name or Vendor ID (handle).
      - in: query
        name: status
        schema:
          type: string
        description: active | suspended | closed_permanently
      - in: query
        name: verification_status
        schema:
          type: string
        description: unverified | pending | verified | rejected
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminVendorList'
          description: ''
  /api/v1/admin/vendors/{handle}:
    get:
      operationId: admin_vendors_retrieve
      parameters:
      - in: path
        name: handle
        schema:
          type: string
          pattern: ^@?[A-Za-z0-9]{3,16}$
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminVendorDetail'
          description: ''
  /api/v1/admin/vendors/{handle}/restore:
    post:
      operationId: admin_vendors_restore_create
      parameters:
      - in: path
        name: handle
        schema:
          type: string
          pattern: ^@?[A-Za-z0-9]{3,16}$
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminVendorDetail'
          description: ''
  /api/v1/admin/vendors/{handle}/suspend:
    post:
      operationId: admin_vendors_suspend_create
      parameters:
      - in: path
        name: handle
        schema:
          type: string
          pattern: ^@?[A-Za-z0-9]{3,16}$
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminVendorSuspendRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminVendorSuspendRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminVendorSuspendRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminVendorDetail'
          description: ''
  /api/v1/admin/vendors/{handle}/verify:
    post:
      operationId: admin_vendors_verify_create
      description: |-
        POST /admin/vendors/{handle}/verify — records a real decision in `VendorVerification` (a
        Phase-0 schema table that existed but nothing wrote to before this) and updates the vendor's
        live `verification_status`. Reuses the `vendors.verify_vendor` Django permission already
        declared on `Vendor.Meta` since Phase 8/9 — no new permission needed.
      parameters:
      - in: path
        name: handle
        schema:
          type: string
          pattern: ^@?[A-Za-z0-9]{3,16}$
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminVendorVerifyDecisionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminVendorVerifyDecisionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminVendorVerifyDecisionRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminVendorDetail'
          description: ''
  /api/v1/admin/whoami:
    get:
      operationId: admin_whoami_retrieve
      description: Used by the admin web app to confirm an admin-grade session (password
        + OTP).
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminWhoAmI'
          description: ''
  /api/v1/ai/detections:
    post:
      operationId: ai_detections_create
      description: |-
        POST creates a scan; GET-like history lives at `/vendors/me/ai-detections` instead, so this
        stays a plain creation endpoint (mirrors `VendorProductCollectionView`'s split).
      tags:
      - ai
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIDetectRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AIDetectRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AIDetectRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIDetection'
          description: ''
  /api/v1/ai/detections/{id}:
    get:
      operationId: ai_detections_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - ai
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIDetection'
          description: ''
  /api/v1/ai/detections/{id}/confirm:
    post:
      operationId: ai_detections_confirm_create
      description: |-
        POST /ai/detections/{id}/confirm — the vendor's edited final values, in the exact same shape
        as manual `POST /vendor-products` (master prompt §17: "the final action must be explicit; the
        AI must never automatically publish").
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - ai
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VendorProductCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VendorProductCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VendorProductCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorProduct'
          description: ''
  /api/v1/auth/admin/password:
    post:
      operationId: auth_admin_password_create
      description: 'Admin step 1: password. On success an OTP is sent (step 2 = otp/verify
        with purpose=admin).'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminPasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminPasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminPasswordRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpSent'
          description: ''
  /api/v1/auth/logout:
    post:
      operationId: auth_logout_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/me:
    get:
      operationId: auth_me_retrieve
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
    patch:
      operationId: auth_me_partial_update
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMeRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/auth/otp/request:
    post:
      operationId: auth_otp_request_create
      description: Send a login code by SMS. Same response whether or not the number
        is registered.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OtpRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OtpRequestRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpSent'
          description: ''
  /api/v1/auth/otp/verify:
    post:
      operationId: auth_otp_verify_create
      description: Verify code → create account if new → return access token (+ refresh
        cookie).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
          description: ''
  /api/v1/auth/token/refresh:
    post:
      operationId: auth_token_refresh_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Access'
          description: ''
  /api/v1/cart:
    get:
      operationId: cart_list
      description: |-
        A customer's own cart — a small, personal, unpaginated list (same shape as vendor quick
        replies). Vendor-aware: items carry their own vendor, grouped client-side (ARCHITECTURE D29).
      tags:
      - cart
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CartItem'
          description: ''
    post:
      operationId: cart_create
      description: |-
        A customer's own cart — a small, personal, unpaginated list (same shape as vendor quick
        replies). Vendor-aware: items carry their own vendor, grouped client-side (ARCHITECTURE D29).
      tags:
      - cart
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartAddRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CartAddRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CartAddRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
