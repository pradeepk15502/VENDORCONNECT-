components:
  schemas:
    AIDetectRequestRequest:
      type: object
      description: |-
        POST /ai/detections. `image_id` must be an image the caller uploaded themselves (checked in
        the view, never trusted from a client-supplied owner/vendor field — master prompt §20).
      properties:
        image_id:
          type: string
          format: uuid
      required:
      - image_id
    AIDetection:
      type: object
      description: Full detail for one scan — what the confirmation screen renders
        (master prompt §17).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        status:
          type: string
          maxLength: 10
        image_url:
          type: string
          nullable: true
          readOnly: true
        provider:
          type: object
          additionalProperties: {}
          nullable: true
          readOnly: true
        predictions:
          type: array
          items:
            $ref: '#/components/schemas/AIPrediction'
        barcode:
          type: string
          maxLength: 32
        ocr_text:
          type: string
          maxLength: 500
        suggested_price:
          allOf:
          - $ref: '#/components/schemas/AISuggestedPrice'
          nullable: true
        existing_listing:
          type: object
          additionalProperties: {}
          nullable: true
          readOnly: true
        message:
          type: string
          readOnly: true
        error:
          type: string
          maxLength: 200
        vendor_corrected:
          type: boolean
          description: vendor chose a different product (training signal)
        latency_ms:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - existing_listing
      - id
      - image_url
      - message
      - predictions
      - provider
      - suggested_price
    AIDetectionListItem:
      type: object
      description: |-
        Lightweight row for the vendor's own scan history and the admin operational list (master
        prompt §19/§25) — never a second product listing surface, just an audit trail.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        vendor_handle:
          type: string
          readOnly: true
        status:
          type: string
          maxLength: 10
        top_label:
          type: string
          nullable: true
          readOnly: true
        top_confidence:
          type: number
          format: double
          nullable: true
          readOnly: true
        provider:
          type: string
          nullable: true
          readOnly: true
        error:
          type: string
          maxLength: 200
        vendor_corrected:
          type: boolean
