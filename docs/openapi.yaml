      - ai
      - moderation
      - orders
      - period_end
      - period_start
      - products
      - range
      - users
      - vendors
    AdminListing:
      type: object
      description: |-
        A vendor's listing (`VendorProduct`), for admin catalog visibility (master prompt §10) — read
        only. Admin staff can browse/filter to spot duplicates or suspicious entries themselves; nothing
        here lets an admin silently edit a vendor's own price/stock (master prompt: "do not silently
        alter vendor-owned pricing or inventory").
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        vendor:
          allOf:
          - $ref: '#/components/schemas/_AdminListingVendorRef'
          readOnly: true
        name:
          type: string
          description: Display name (defaults to product name)
          maxLength: 120
        product_slug:
          type: string
          readOnly: true
        category:
          type: string
          readOnly: true
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        unit:
