  /api/v1/search:
    get:
      operationId: search_list
      description: |-
        GET /search — product/vendor search, ranked per ARCHITECTURE D10. Public; no login required
        (customers can browse before signing in — D17).
      parameters:
      - in: query
        name: category
        schema:
          type: string
        description: Category slug filter.
      - in: query
        name: delivery
        schema:
          type: boolean
        description: Only vendors offering delivery.
      - in: query
        name: in_stock_only
        schema:
          type: boolean
        description: Exclude out-of-stock listings.
      - in: query
        name: lat
        schema:
          type: number
          format: double
        description: Customer's current latitude (sent per request, never stored —
          ARCHITECTURE D11).
        required: true
      - in: query
        name: lng
        schema:
          type: number
          format: double
        description: Customer's current longitude.
        required: true
      - in: query
        name: open_now
        schema:
          type: boolean
        description: Only vendors currently open.
      - in: query
        name: page
        schema:
          type: integer
      - in: query
        name: page_size
        schema:
          type: integer
      - in: query
        name: pickup
        schema:
          type: boolean
        description: Only vendors offering pickup.
      - in: query
        name: price_max
        schema:
          type: number
          format: double
        description: Maximum listing price.
      - in: query
        name: price_min
        schema:
          type: number
          format: double
        description: Minimum listing price.
      - in: query
        name: q
        schema:
          type: string
        description: 'Free text: product name, alias, or Hindi. Blank = browse (use
          with `category`).'
      - in: query
        name: radius_km
        schema:
          type: number
          format: double
        description: Geo-filter radius (0.5–25.0). Default 5.0.
      tags:
      - search
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
