        * `ready` - ready
        * `picked_up` - picked_up
        * `out_for_delivery` - out_for_delivery
        * `delivered` - delivered
        * `completed` - completed
        * `cancel` - cancel
    Address:
      type: object
      description: |-
        Read shape. `lat`/`lng` are null when the address was saved without a captured location
        (text-only entry is allowed — ARCHITECTURE D29 — but such an address can't be used for delivery
        eligibility, since that needs real coordinates to measure distance from).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        label:
          type: string
          maxLength: 40
        line1:
          type: string
          maxLength: 200
        line2:
          type: string
          maxLength: 200
        landmark:
          type: string
          maxLength: 120
        city:
          type: string
          maxLength: 80
        state:
          type: string
          maxLength: 80
        pincode:
          type: string
          maxLength: 6
        lat:
          type: number
          format: double
          nullable: true
          readOnly: true
        lng:
          type: number
          format: double
          nullable: true
          readOnly: true
        is_default:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - city
      - created_at
      - id
      - lat
      - line1
      - lng
      - pincode
    AddressWriteRequest:
      type: object
      description: |-
        Write shape for POST/PATCH. `lat`/`lng` are optional (see `AddressSerializer`) but must be
        given together — a half-set coordinate isn't a usable point.
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 40
        line1:
          type: string
          minLength: 1
          maxLength: 200
        line2:
          type: string
          maxLength: 200
        landmark:
          type: string
          maxLength: 120
        city:
          type: string
          minLength: 1
          maxLength: 80
        state:
          type: string
          maxLength: 80
        pincode:
          type: string
          minLength: 1
          maxLength: 6
        lat:
          type: number
          format: double
          maximum: 37.5
          minimum: 6.0
          nullable: true
        lng:
          type: number
          format: double
          maximum: 97.5
          minimum: 68.0
          nullable: true
        is_default:
          type: boolean
