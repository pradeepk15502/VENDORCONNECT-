      - stock_updated_at
      - unit
    VendorProductUpdateStatusEnum:
      enum:
      - active
      - paused
      type: string
      description: |-
        * `active` - active
        * `paused` - paused
    VendorPublic:
      type: object
      description: What any customer sees. No owner info, no internal ids beyond the
        stable UUID.
      properties:
        handle:
          type: string
          readOnly: true
        vendor_id:
          type: string
        shop_name:
          type: string
          maxLength: 120
        verified:
          type: boolean
          readOnly: true
        is_open:
          type: boolean
          description: Manual shop status; source of truth for customers
        status_changed_at:
          type: string
          format: date-time
          nullable: true
        public_phone:
          type: string
          description: Shown to customers for calls
          maxLength: 16
        categories:
          type: array
          items:
            type: string
          readOnly: true
        rating_avg:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,2})?$
        rating_count:
          type: integer
          maximum: 2147483647
          minimum: 0
        follower_count:
          type: integer
          maximum: 2147483647
          minimum: 0
        is_following:
          type: boolean
          readOnly: true
        location:
          allOf:
          - $ref: '#/components/schemas/LocationOut'
          nullable: true
          readOnly: true
        delivery:
          allOf:
          - $ref: '#/components/schemas/Delivery'
          readOnly: true
        bio:
          type: string
          default: ''
      required:
      - categories
      - delivery
      - handle
      - is_following
      - location
      - shop_name
      - vendor_id
      - verified
    VendorRef:
      type: object
      properties:
        handle:
          type: string
        shop_name:
          type: string
      required:
      - handle
      - shop_name
    VendorSummary:
      type: object
      description: |-
        GET /vendors/me/summary (Phase 5) — the vendor dashboard's stat tiles, computed for real
        from the vendor's own listings in one aggregate query (ARCHITECTURE D25). No orders/sales
        fields here: those need the order system (Phase 8) and showing a fake 0 until then would be
        exactly the fabricated data the project brief forbids — the dashboard omits those tiles.
      properties:
        is_open:
          type: boolean
        status_changed_at:
          type: string
          format: date-time
          nullable: true
        product_count:
          type: integer
        low_stock_count:
          type: integer
        out_of_stock_count:
          type: integer
      required:
      - is_open
      - low_stock_count
      - out_of_stock_count
      - product_count
      - status_changed_at
    VerificationStatusEnum:
      enum:
      - unverified
      - pending
      - verified
      - rejected
      type: string
      description: |-
        * `unverified` - Unverified
        * `pending` - Pending review
        * `verified` - Verified
        * `rejected` - Rejected
    _AIMetrics:
      type: object
      properties:
        detections:
          type: integer
          description: Scans attempted within the selected period.
        failed_detections:
          type: integer
        dev_scanner_usage:
          type: integer
          description: 'Detections from a model version flagged is_development (currently:
            all of them — see docs/AI.md).'
      required:
      - detections
      - dev_scanner_usage
      - failed_detections
    _AdminListingVendorRef:
      type: object
      properties:
        handle:
          type: string
        shop_name:
          type: string
      required:
      - handle
      - shop_name
    _AdminOwnerRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        phone:
          type: string
      required:
      - id
      - name
      - phone
    _AdminVendorRef:
      type: object
      properties:
        handle:
          type: string
        shop_name:
          type: string
      required:
      - handle
      - shop_name
    _CartVendor:
      type: object
      description: |-
        A cart row's vendor group header — enough to render the group and gate its checkout button
        (closed shop, pickup/delivery availability) without a second request per vendor.
      properties:
        handle:
          type: string
        vendor_id:
          type: string
        shop_name:
          type: string
        status:
          type: string
        is_open:
          type: boolean
        delivery:
          $ref: '#/components/schemas/Delivery'
      required:
      - delivery
      - handle
      - is_open
      - shop_name
      - status
      - vendor_id
    _LastMessagePreview:
      type: object
      description: |-
        Documentation-only shape of `get_last_message`'s dict — it is built from four separate
        `last_message_*` annotations/attributes, never from a real `Message` instance.
      properties:
        text:
          type: string
        kind:
          type: string
        sender_side:
          type: string
        created_at:
          type: string
          format: date-time
      required:
      - created_at
      - kind
      - sender_side
      - text
    _MessageListing:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        unit:
          type: string
      required:
      - id
      - name
      - price
      - unit
    _ModerationMetrics:
      type: object
      properties:
        open_reports:
          type: integer
          description: Current backlog (open/reviewing), not period-scoped.
        reported_posts:
          type: integer
          description: Distinct posts newly reported within the period.
        reported_reviews:
          type: integer
          description: Distinct reviews newly reported within the period.
        hidden_content:
          type: integer
          description: Currently-hidden posts + reviews, not period-scoped.
      required:
      - hidden_content
      - open_reports
      - reported_posts
      - reported_reviews
    _OrderCustomerRef:
      type: object
      description: |-
        What the *vendor* side sees about the buyer — name only, never phone (the same D14 rule
        `_ChatCustomerSerializer` already enforces for chat).
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
      required:
      - id
      - name
    _OrderMetrics:
      type: object
      properties:
        total:
          type: integer
          description: Orders placed within the selected period.
        pending:
          type: integer
          description: 'In-flight: not yet completed, cancelled or rejected.'
        completed:
          type: integer
        cancelled:
          type: integer
          description: Cancelled or rejected.
      required:
      - cancelled
      - completed
      - pending
      - total
    _OrderVendorRef:
      type: object
      properties:
        handle:
          type: string
        vendor_id:
          type: string
        shop_name:
          type: string
        public_phone:
          type: string
        is_open:
          type: boolean
      required:
      - handle
      - is_open
      - public_phone
      - shop_name
      - vendor_id
    _ProductMetrics:
      type: object
      properties:
        total:
          type: integer
          description: Active catalog taxonomy entries (not vendor listings).
        active_listings:
          type: integer
          description: VendorProduct rows with status=active.
        out_of_stock_listings:
          type: integer
      required:
      - active_listings
      - out_of_stock_listings
      - total
    _SearchVendor:
      type: object
      properties:
        handle:
          type: string
        vendor_id:
          type: string
        shop_name:
          type: string
        is_open:
          type: boolean
        verified:
          type: boolean
          readOnly: true
        delivery_enabled:
          type: boolean
          readOnly: true
        lat:
          type: number
          format: double
          nullable: true
          readOnly: true
        lng:
          type: number
          format: double
          nullable: true
          readOnly: true
      required:
      - delivery_enabled
      - handle
      - is_open
      - lat
      - lng
      - shop_name
      - vendor_id
      - verified
    _UserMetrics:
      type: object
      properties:
        total:
          type: integer
          description: All accounts, any time.
        new:
          type: integer
          description: date_joined within the selected period.
        active:
          type: integer
          description: last_login within the selected period.
      required:
      - active
      - new
      - total
    _VendorMetrics:
      type: object
      properties:
        total:
          type: integer
          description: All shops, any time (not period-scoped).
        pending_verification:
          type: integer
        active:
          type: integer
        suspended:
          type: integer
      required:
      - active
      - pending_verification
      - suspended
      - total
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
