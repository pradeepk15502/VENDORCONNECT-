server {
  listen 80;
  root /usr/share/nginx/html;
  server_tokens off;
  # Phase 12 hardening: without this, nginx's own default (1m) already blocks the documented video
  # upload limit (MEDIA_MAX_VIDEO_MB=50, services/api/config/settings/base.py), but relying on that
  # coincidence isn't a real limit — it's not sized to the app's actual limit, and Django's own
  # DATA_UPLOAD_MAX_MEMORY_SIZE doesn't apply to multipart file parts at all, so nothing app-side
  # bounds how much of an oversized upload gets buffered before the app's own (post-read) size check
  # runs. Capping it here, at the edge, means an oversized body is rejected (413) before it reaches
  # the API process at all. Sized just above the largest allowed upload (50 MB video) with headroom
  # for multipart overhead.
  client_max_body_size 55m;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=(self)" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'" always;

  # API is served on the same origin (refresh cookie is SameSite=Strict)
  location /api/ { proxy_pass http://api:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
  location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; }
}
